<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь Анеллиона</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#eee3cf;background:#171511}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#342b20,#171511 70%)}main{width:min(1440px,100%);padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}h1{font:500 clamp(19px,3vw,28px) Georgia,serif;margin:0}.tag{font-size:12px;color:#b9a88b;letter-spacing:.08em}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{font:inherit;cursor:pointer;color:#e9ddc6;border:1px solid #62513a;border-radius:9px;background:#2e281f;padding:10px 15px;transition:background .15s}button:hover{background:#443725}button[aria-pressed=true]{background:#6b4c2b;border-color:#c19a62;color:#fff3da}button:focus-visible,canvas:focus-visible{outline:2px solid #e8bf78;outline-offset:3px}button:disabled{opacity:.35;cursor:default}.stage{position:relative;border:1px solid #6b5538;border-radius:12px;overflow:hidden;background:#241f18;box-shadow:0 12px 50px #0005}canvas{display:block;width:100%;aspect-ratio:2/1;outline:0}.locked{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;pointer-events:none;background:linear-gradient(#15120e75,transparent 45%)}.locked[hidden]{display:none}.lock-card{display:flex;align-items:center;gap:14px;max-width:90%;padding:15px 22px;border:1px solid #a58c5c;border-radius:12px;background:#211d16eF;box-shadow:0 8px 30px #0006}.lock-card svg{width:32px;height:38px;flex-shrink:0}.lock-card strong{display:block;font:600 20px Georgia,serif;color:#f0d9a9}.lock-card p{margin:5px 0 0;font-size:13px;color:#c9baa0}.status{color:#c9bda6;font-size:14px;min-height:22px;margin:12px 0;text-align:center}.controls{display:flex;justify-content:center;gap:10px}.controls button{width:92px;font-size:22px;touch-action:none;user-select:none}.note{font-size:12px;text-align:center;color:#9d907a;margin:12px 0 0}@media(max-width:600px){main{padding:12px}header{align-items:flex-start}.tag{max-width:100px;text-align:right}nav{gap:5px}nav button{padding:8px 10px;font-size:12px}.lock-card{padding:9px 12px}.lock-card strong{font-size:16px}.lock-card p{font-size:11px}.locked{padding-top:10px}.status{font-size:12px}}

.window-marker{position:absolute;left:4.2%;top:32%;width:10%;height:23%;padding:0;border:0;border-radius:4px;background:transparent;box-shadow:none;}
.window-marker span{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);white-space:nowrap;font-size:12px;background:#211b13e8;border:1px solid #957349;padding:5px 9px;border-radius:5px;}
.window-marker:hover,.window-marker.nearby{background:transparent;border:0;box-shadow:none;}
.window-prompt:disabled{opacity:1;cursor:default;}
.window-marker[hidden],.window-prompt[hidden]{display:none;}
.window-prompt{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:#2b2115f2;border-color:#d4ac6c;white-space:nowrap;font-size:14px;}
.window-progress{text-align:center;font-size:13px;color:#dfc38e;margin:12px 0 0;}
.quest-dialog{box-sizing:border-box;width:min(520px,calc(100% - 24px));max-height:85vh;overflow:auto;background:#292218;color:#eee3cf;border:1px solid #b89156;border-radius:15px;padding:30px;box-shadow:0 24px 100px #000a;}
.quest-dialog::backdrop{background:#100c08b8;}
.quest-close{position:absolute;right:10px;top:8px;font-size:23px;padding:2px 10px;background:transparent;border-color:transparent;}
.quest-eyebrow{font-size:10px;letter-spacing:.13em;color:#c4a477;margin:0 35px 12px 0;}
.quest-dialog h2{font:500 29px Georgia,serif;margin:0 0 10px;}
.quest-meta{font-size:12px;color:#c8b48f;border-bottom:1px solid #665137;padding-bottom:15px;}
.quest-content h3{font-size:19px;line-height:1.45;margin:18px 0;}
.quest-content p{font-size:14px;line-height:1.6;color:#dfd2ba;}
.quest-content button{display:block;width:100%;margin-top:10px;text-align:center;}
.quest-content .quest-answer{text-align:left;min-height:48px;}
@media(max-width:600px){.window-marker span{font-size:9px;padding:3px 5px;}.window-prompt{font-size:11px;padding:7px 10px;}.quest-dialog{padding:24px 18px;}}

.quest-meta:empty{display:none;}
.quest-reward{margin:20px 0;padding:18px 20px;border:1px solid #ad8444;border-radius:10px;background:linear-gradient(135deg,#5b42222e,#c3954526);box-shadow:inset 0 1px #efd29322,0 5px 18px #0002;}
.quest-reward strong{display:block;color:#edce8b;font:600 18px Georgia,serif;letter-spacing:.03em;margin-bottom:12px;}
.quest-reward p{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:8px 0;color:#ead8b6;}
.quest-reward b{color:#ffe3a0;font-size:18px;font-variant-numeric:tabular-nums;}

.game-hud{display:grid;grid-template-columns:1fr 1fr .72fr;gap:12px;margin:20px 0 12px;}
.growth-card{min-width:0;padding:17px 19px 14px;border:1px solid #665239;border-radius:12px;background:linear-gradient(145deg,#3d3122,#251f18);box-shadow:inset 0 1px #e8c68b0c;}
.growth-heading{display:flex;align-items:center;gap:9px;}.growth-heading h2{font:500 19px Georgia,serif;margin:0;}.growth-icon{font-size:23px;color:#d6b77e;line-height:1;}.level-pill{margin-left:auto;font-size:11px;white-space:nowrap;border:1px solid #7a6240;border-radius:20px;padding:4px 8px;color:#e2c89b;}
.xp-caption{display:flex;justify-content:space-between;gap:8px;margin:16px 0 8px;font-size:11px;color:#cbbb9f;font-variant-numeric:tabular-nums;}.xp-caption>span:last-child{color:#ac9c80;}
.xp-track{height:8px;border-radius:5px;background:#15130f;border:1px solid #645034;overflow:hidden;}.xp-track>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#a16b35,#e1b970);border-radius:4px;transition:width .5s ease;}.hero-growth .xp-track>span{background:linear-gradient(90deg,#638a82,#b7d2bb);}.hero-growth .growth-icon{color:#b7d2bb;}
.growth-note{font-size:11px;color:#b7a68b;margin:10px 0 0;line-height:1.5;}.energy-charges{display:flex;gap:9px;margin-top:12px;}.energy-charges span{display:grid;place-items:center;border:1px solid #98723e;background:#67491f66;color:#f2cc7b;border-radius:7px;width:32px;height:31px;font-size:25px;box-shadow:inset 0 0 12px #f4c05d10;}
.journey-info{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:13px 16px;margin-bottom:18px;border:1px solid #514430;border-radius:9px;background:#211c15;position:relative;}.journey-goal{display:flex;gap:12px;align-items:center;}.goal-emblem{color:#d3b071;font-size:27px;}.goal-eyebrow{font-size:9px;letter-spacing:.12em;color:#a99270;}.journey-goal p{font-size:13px;margin:4px 0 0;color:#e4d3b4;}.journey-map{font-size:12px;color:#cdb68f;}.journey-map summary{cursor:pointer;padding:8px 0;white-space:nowrap;}.journey-map summary span{margin-left:8px;}.journey-map[open]{z-index:3;}.journey-map ol{position:absolute;right:0;top:100%;width:min(370px,100%);margin:7px 0 0;padding:15px;list-style:none;background:#282117;border:1px solid #8c6e44;border-radius:10px;box-shadow:0 15px 35px #0008;}.journey-map li{display:flex;gap:12px;align-items:center;padding:7px 0;line-height:1.5;}.journey-map li>span:first-child{display:grid;place-items:center;flex-shrink:0;width:26px;height:26px;border:1px solid #715a3a;border-radius:50%;color:#dfbc83;font-size:11px;}.journey-map .reached{color:#c8dcbb;}.journey-map .reached>span:first-child{border-color:#9cac83;}
@media(max-width:760px){.game-hud{grid-template-columns:1fr 1fr;gap:8px;margin-top:15px;}.energy-card{grid-column:1/-1;display:flex;align-items:center;gap:15px;flex-wrap:wrap;}.energy-card .growth-heading{min-width:145px;}.energy-card .energy-charges{margin:0;}.energy-card .growth-note{margin:0;margin-left:auto;}.growth-card{padding:13px;}.growth-heading h2{font-size:16px;}.growth-icon{display:none;}.xp-caption{font-size:10px;}.journey-info{gap:10px;padding:10px;}.journey-goal p{font-size:12px;}.journey-map summary{font-size:11px;}}
@media(max-width:410px){.growth-heading{gap:3px;}.level-pill{font-size:9px;padding:4px 5px;}.xp-caption{display:block;}.xp-caption>span:last-child{display:block;margin-top:4px;}.energy-card .growth-note{margin-left:0;}.journey-goal .goal-emblem{display:none;}}

.energy-infinity{font:400 48px Georgia,serif;line-height:1;color:#f2cc7b;margin-top:10px;}
.energy-charges[hidden],.energy-infinity[hidden],.energy-card [hidden]{display:none;}
.journey-info{border:0;background:transparent;padding:0 2px;margin-bottom:12px;align-items:center;}
.faq-button{margin-left:auto;font-size:11px;color:#a6977e;border:0;background:transparent;padding:5px 8px;letter-spacing:.06em;}
.faq-button:hover{color:#e4c88d;background:#ffffff08;}
.faq-questions details{border-bottom:1px solid #665137;padding:13px 0;}
.faq-questions details:last-child{border:0;}
.faq-questions summary{cursor:pointer;font-size:14px;color:#e3c998;line-height:1.5;}
.faq-questions p{font-size:13px;color:#cfc0a7;line-height:1.65;margin:10px 0 0;}
.faq-dialog h2{margin-bottom:14px;}
@media(max-width:760px){.energy-infinity{margin:0 0 0 auto;font-size:38px;}}

.window-marker{z-index:1;}
canvas.hero-layer{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.window-prompt,.locked{z-index:3;}

.developer-toggle{display:flex;align-items:center;gap:7px;color:#bda781;font-size:11px;cursor:pointer;}
.developer-toggle input{accent-color:#c9a361;cursor:pointer;}
.developer-pass{border-color:#c9a361;background:#584023;}

.level-celebration{text-align:center;padding:22px 18px;margin:20px 0;border:1px solid #e1b76a;border-radius:12px;background:radial-gradient(ellipse at top,#98703255,#3b2b18);box-shadow:inset 0 0 35px #d4a25115,0 6px 24px #0003;animation:level-reveal .4s ease-out;}
.level-celebration-icon{color:#ffdc92;font-size:38px;line-height:1;text-shadow:0 0 20px #efbd6c80;}
.quest-content .level-celebration h3{font:500 25px/1.3 Georgia,serif;color:#ffe3a3;margin:12px 0;}
.level-celebration strong{display:block;margin-top:18px;color:#edce8b;font-size:13px;}
.quest-content .level-celebration p{margin:6px 0;color:#ebd6b0;}
@keyframes level-reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.level-celebration{animation:none;}}

.level-dialog .level-celebration{margin:0 0 18px;}
.level-dialog>button{width:100%;}
.level-dialog .level-celebration h3{font:500 25px/1.3 Georgia,serif;color:#ffe3a3;}
.level-dialog .level-celebration p{font-size:14px;line-height:1.5;}
</style>
</head>
<body>
<main>
<header><h1>Путь Анеллиона</h1></header>
<div class="game-hud" aria-label="Состояние героя и Империи"></div>
<div class="journey-info"></div>
<nav aria-label="Локации">
<button data-scene="0" aria-pressed="true">Спальня</button>
<button data-scene="1" aria-pressed="false">Кабинет</button>
<button data-scene="2" aria-pressed="false">Площадь</button>
<button data-scene="3" aria-pressed="false">Столовая</button>
<button data-scene="4" aria-pressed="false">🔒 Консильерг</button>
</nav>
<div class="stage">
<canvas width="1440" height="720" tabindex="0" aria-label="Анеллион в спальне. Стрелки влево и вправо — движение."></canvas>
<div class="locked" hidden><div class="lock-card"><svg viewBox="0 0 32 40" fill="none" aria-hidden="true"><path d="M8 18V11a8 8 0 0 1 16 0v7" stroke="#e2bd75" stroke-width="3"/><rect x="3" y="17" width="26" height="20" rx="4" fill="#a77d3b"/><circle cx="16" cy="25" r="3" fill="#292116"/><path d="M16 26v5" stroke="#292116" stroke-width="3"/></svg><div><strong>Консильерг закрыт</strong><p>Доступ появится после испытания на 5-м уровне Империи.</p></div></div></div>
</div>
<p class="status" role="status" aria-live="polite">Загружаем выбранные локации…</p>
<div class="controls" aria-label="Движение"><button data-direction="left" aria-label="Идти влево" disabled>←</button><button data-direction="right" aria-label="Идти вправо" disabled>→</button></div>
</main>
<script>
if(new URLSearchParams(location.search).get('restart')==='1'){
 try{
  localStorage.setItem('anellion-bedroom-v3',JSON.stringify({completed:[],allocations:[],energy:3,nextEnergy:0}));
  localStorage.setItem('anellion-developer-mode','false');
  const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('restart');history.replaceState(null,'',cleanUrl.href);
 }catch{}
}
</script>
<script src="developer.js?v=1"></script>
<script src="window-questions.js?v=3"></script>
<script src="window-quest.js?v=17"></script>
<script src="hud.js?v=6"></script>
<script src="world-2d.js?v=14"></script>
</body>
</html>
