l","Күрек"],"Сломанная лопата":["Broken shovel","Сынған күрек"],"Семена":["Seeds","Тұқымдар"],"Сундук с семенами":["Seed chest","Тұқым салынған сандық"],"Пугало":["Scarecrow","Қарақшы"],"Соломенное пугало":["Straw scarecrow","Сабан қарақшы"],"Плуг":["Plow","Соқа"],"Ржавый плуг":["Rusty plow","Тот басқан соқа"],"Лошади":["Horses","Жылқылар"],"Ветхий загон с лошадьми":["Dilapidated horse pen","Жылқылары бар тозған қора"],"Связка ключей":["Bunch of keys","Кілттер шоғы"],"Счёты":["Abacus","Есепшот"],"Сундук с монетами":["Chest of coins","Тиындар салынған сандық"],"Пила":["Saw","Ара"],"Двуручная пила":["Two-person saw","Қос тұтқалы ара"],"Топор":["Axe","Балта"],"Ржавый топор":["Rusty axe","Тот басқан балта"],"Инструменты":["Tools","Құралдар"],"Шкаф с инструментами":["Tool cabinet","Құралдар шкафы"],"Лампа":["Lamp","Шырақ"],"Масляная лампа":["Oil lamp","Майшам"],"Щит":["Shield","Қалқан"],"Деревянный щит":["Wooden shield","Ағаш қалқан"],"Колокол":["Bell","Қоңырау"],"Сигнальный колокол":["Signal bell","Белгі қоңырауы"],"Барабан":["Drum","Дабыл"],"Военный барабан":["War drum","Әскери дабыл"],"Меч":["Sword","Қылыш"],"Ржавый меч":["Rusty sword","Тот басқан қылыш"],"Оружие":["Weapons","Қару-жарақ"],"Сундук с оружием":["Weapons chest","Қару салынған сандық"],"Старый железный масляный фонарь: закопчённое стекло, ржавая ручка и давно погасший фитиль.":["An old iron oil lantern: soot-stained glass, a rusty handle, and a wick extinguished long ago.","Ескі темір майшам: әйнегін күйе басқан, тұтқасы тот басқан, білтесі әлдеқашан сөнген."],"Карта шахты":["Mine map","Шахта картасы"],"Пожелтевший, частично порванный пергамент с выцветшими обозначениями тоннелей на деревянной доске.":["Yellowed, partly torn parchment with faded tunnel markings on a wooden board.","Ағаш тақтадағы туннель белгілері өшкен, сарғайып, жартылай жыртылған пергамент."],"Ящик с минералами":["Mineral crate","Минералдар жәшігі"],"Прогнивший ящик с треснувшими стенками. Внутри — немного угля и низкокачественной железной руды.":["A rotten crate with cracked sides. Inside are a little coal and low-grade iron ore.","Қабырғалары жарылған шірік жәшік. Ішінде аздаған көмір мен сапасыз темір кені бар."],"Кирка":["Pickaxe","Қайла"],"Сильно проржавевший наконечник и треснувшая деревянная рукоятка. Кирка прислонена к каменной стене.":["A heavily rusted head and a cracked wooden handle. The pickaxe leans against a stone wall.","Басы қатты тот басқан, ағаш сабы жарылған. Қайла тас қабырғаға сүйеулі тұр."],"Вагонетка":["Minecart","Кен арбасы"],"Перевёрнутая вагонетка с проржавевшим корпусом, погнутыми колёсами и остатками камней.":["An overturned cart with a rusty body, bent wheels, and a few remaining stones.","Корпусы тот басқан, дөңгелектері майысқан, ішінде тас қалдықтары бар аударылған кен арбасы."],"Закрыть":["Close","Жабу"],"СПАЛЬНЯ":["BEDROOM","ЖАТЫН БӨЛМЕ"],"Сначала пройди: ${items[Math.max(0,i-1)].name}":["Complete first: ${items[Math.max(0,i-1)].name}","Алдымен мынаны аяқта: ${items[Math.max(0,i-1)].name}"],"Империя":["Empire","Империя"],"Империя обрела величие":["The Empire Has Achieved Greatness","Империя ұлылыққа жетті"],"Когда-то всё началось с грязного окна. Теперь города процветают, а слава Империи разносится далеко за её границы.":["It all began with a dirty window. Now cities flourish, and the Empire's fame spreads far beyond its borders.","Бәрі бір кездері кір терезеден басталды. Енді қалалар гүлденіп, Империяның даңқы шекарасынан алысқа тарады."],"Анеллиону больше нет равных.":["Anellion has no equal anymore.","Анеллионға енді тең келер ешкім жоқ."],"Народ любит своего защитника: его славят на площадях, встречают улыбками — настоящий красавчик и великий правитель.":["The people love their protector: they praise him in the squares and greet him with smiles — a handsome hero and a great ruler.","Халық өз қорғаушысын жақсы көреді: алаңдарда мадақтап, күлімдеп қарсы алады — нағыз көрікті қаһарман әрі ұлы билеуші."],"Но за дальними горами зажигаются незнакомые огни. Сова приносит весть из земель, которых нет ни на одной карте.":["But unfamiliar lights are kindling beyond distant mountains. The Owl brings news from lands found on no map.","Бірақ алыс таулардың ар жағында бейтаныс оттар жануда. Үкі ешбір картада жоқ жерлерден хабар әкелді."],"Даже величайшая Империя — лишь начало большой истории…":["Even the greatest Empire is only the beginning of a larger story…","Ең ұлы Империяның өзі — үлкен оқиғаның басы ғана…"],"Вернуться в Империю":["Return to the Empire","Империяға оралу"],"Поздравляем! ${entry.name} — уровень ${entry.level}!":["Congratulations! ${entry.name} — level ${entry.level}!","Құттықтаймыз! ${entry.name} — ${entry.level}-деңгей!"],"Чистый облик":["A clean appearance","Таза келбет"],"Анеллион тщательно вымыт: кожа и волосы чистые.":["Anellion has washed thoroughly: his skin and hair are clean.","Анеллион мұқият жуынған: терісі мен шашы таза."],"Бритьё и новая причёска":["A shave and a new haircut","Қырыну және жаңа шаш үлгісі"],"Анеллион гладко выбрит, волнистые волосы аккуратно подстрижены и уложены.":["Anellion is clean-shaven, with his wavy hair neatly cut and styled.","Анеллион тап-таза қырынған, бұйра шашы ұқыпты қиылып, таралған."],"Солнечный облик Анеллиона":["Anellion's solar form","Анеллионның күндей келбеті"],"Глаза Анеллиона сияют солнечным светом: он пробудил в себе силу Солнца. Анеллион получил императорское кольцо с символом солнца.":["Anellion's eyes shine with sunlight: he has awakened the power of the Sun. He has received an imperial ring bearing the sun symbol.","Анеллионның көзі күн сәулесіндей жарқырайды: ол бойындағы Күн күшін оятты. Анеллион күн нышаны бар императорлық сақинаға ие болды."],"Роскошное императорское облачение":["Luxurious imperial attire","Сәнді императорлық киім"],"Анеллион получил роскошную белую тунику с красно-золотым поясом и символом имперского солнца.":["Anellion has received a luxurious white tunic with a red-and-gold belt and the imperial sun emblem.","Анеллион қызыл-алтын белдігі және империялық күн нышаны бар сәнді ақ туника алды."],"Второе физическое преображение":["Second physical transformation","Екінші дене өзгерісі"],"Плечи, руки и ноги стали заметно мощнее и рельефнее.":["His shoulders, arms, and legs have become noticeably stronger and more defined.","Иығы, қолы мен аяғы айтарлықтай қуатты әрі бұлшықетті болды."],"Первое развитие мускулатуры":["First muscle development","Бұлшықеттердің алғашқы дамуы"],"Плечи и руки стали крепче и рельефнее, ноги — плотнее.":["His shoulders and arms have become stronger and more defined, and his legs sturdier.","Иығы мен қолы күшейіп, бұлшықеттері айқындала түсті, аяғы нығайды."],"Новая белая туника":["A new white tunic","Жаңа ақ туника"],"Анеллион получил новую простую белую тунику — чистую и целую. На талии тонкий красный шнурок, завязанный простым узлом.":["Anellion has received a simple new white tunic — clean and intact. A thin red cord is tied at his waist with a simple knot.","Анеллион жаңа қарапайым ақ туника алды — таза әрі бүтін. Беліне жіңішке қызыл бау жай түйінмен байланған."],"Под твоим правлением Империя достигла полного расцвета! Среди держав-соперников ей нет равных: границы расширяются, города процветают, а жители живут в достатке. Поля приносят щедрые урожаи, сокровищница полна, мастерские и рудники работают во всю силу, а обученная армия надёжно защищает твои земли. Ты превратил свою Империю в великую державу!":["Under your rule, the Empire has fully flourished! It has no equal among rival states: borders expand, cities thrive, and the people prosper. Fields yield rich harvests, the treasury is full, workshops and mines run at full strength, and a trained army protects your lands. You have made your Empire a great power!","Сенің билігіңде Империя толық гүлденді! Қарсылас мемлекеттердің арасында оған тең келері жоқ: шекарасы кеңейіп, қалалар өркендеп, халық молшылықта өмір сүруде. Егістіктер мол өнім береді, қазына толы, шеберханалар мен кеніштер толық қуатпен жұмыс істейді, ал жаттыққан әскер жеріңді қорғайды. Сен Империяңды ұлы державаға айналдырдың!"],"Империя расцветает: покои стали уютнее, кабинет — величественнее, площадь украсили фонтаны и цветники, а столовая встречает жителей щедрыми трапезами. На полях появились первые всходы, а в казне и на складе — первые накопления.":["The Empire is flourishing: chambers are cozier, the office grander, fountains and flowerbeds adorn the square, and the dining hall welcomes people with generous meals. The first shoots have appeared in the fields, and the treasury and storehouse have begun to fill.","Империя гүлденуде: бөлмелер жайлы, кабинет айбынды болды, алаңды субұрқақтар мен гүлзарлар көркейтті, асханада мол дастарқан жайылды. Егістіктерде алғашқы өскіндер пайда болып, қазына мен қоймада алғашқы қор жиналды."],"Империя крепнет под твоим правлением. Резиденция обрела уют, кабинет — достоинство державы, площадь стала центром торговли, а столовая встречает жителей богатой трапезой. Империя развивается: здания становятся ухоженнее, а жизнь жителей — благополучнее.":["The Empire grows stronger under your rule. The residence is cozy, the office worthy of a state, the square a trading center, and the dining hall offers hearty meals. Buildings are better kept, and people's lives more prosperous.","Сенің билігіңде Империя күшеюде. Резиденция жайлы болды, кабинет мемлекеттің абыройын көрсетеді, алаң сауда орталығына айналды, ал асханада мол ас беріледі. Ғимараттар күтімді, халықтың тұрмысы ауқатты бола түсті."],"Первые плоды твоего правления видны повсюду: в спальне и кабинете завершён скромный ремонт, площадь оживает, а в столовой снова готовят горячую еду. Империя вступает в эпоху восстановления.":["The first fruits of your rule are visible everywhere: modest repairs in the bedroom and office are complete, the square is coming to life, and hot food is being cooked again. The Empire enters an age of restoration.","Билігіңнің алғашқы жемістері барлық жерден байқалады: жатын бөлме мен кабинеттегі қарапайым жөндеу аяқталды, алаң жанданып, асханада қайтадан ыстық тамақ пісірілуде. Империя қалпына келу дәуіріне қадам басты."],"Кабинет правления Империей":["Imperial government office","Империяны басқару кабинеті"],"Главная площадь Империи":["The Empire's main square","Империяның басты алаңы"],"Общая столовая":["Communal dining hall","Ортақ асхана"],"Испытание для открытия Консильерга":["Trial to unlock Consilyerg","Консильергті ашу сынағы"],"Сельскохозяйственные поля":["Farmland","Егістіктер"],"Имперская казна и склад ресурсов":["Imperial treasury and resource storehouse","Империялық қазына мен қор қоймасы"],"Разрушенная лесопилка":["Ruined sawmill","Қираған ағаш кесу орны"],"Военный лагерь Империи":["Imperial military camp","Империяның әскери лагері"],"Заброшенная шахта":["Abandoned mine","Тасталған шахта"],"Вам теперь доступны":["Now available to you","Енді саған қолжетімді"],"Продолжить":["Continue","Жалғастыру"],"Анеллион и Империя достигли полного развития! Мудрая Сова помогла тебе вырасти в благодарность за знания, которые ты оставил ей. Оставшиеся задания у предметов можно не проходить — цель игры уже достигнута.":["Anellion and the Empire are fully developed! The wise Owl helped you grow in gratitude for the knowledge you left her. You may leave the remaining object quests unfinished — the game's goal has been reached.","Анеллион мен Империя толық дамыды! Дана Үкі қалдырған білімің үшін алғыс ретінде өсуіңе көмектесті. Заттардағы қалған тапсырмаларды аяқтамауға болады — ойынның мақсатына жеттің."],"Вернуться в комнату":["Return to the room","Бөлмеге оралу"],"Все квесты пройдены":["All quests completed","Барлық квест аяқталды"],"Квест ${trial.completed+1} из 3":["Quest ${trial.completed+1} of 3","${trial.completed+1}/3 квест"],"Три верных ответа — квест пройден.":["Three correct answers complete the quest.","Үш дұрыс жауап берсең — квест аяқталады."],"Пройти одним нажатием":["Complete with one click","Бір басумен аяқтау"],"Пройти квест":["Start quest","Квестті бастау"],"Энергия закончилась.":["Out of energy.","Энергия таусылды."],"Одна энергия восстанавливается каждые 8 часов.":["One energy charge is restored every 8 hours.","Әр 8 сағат сайын бір энергия қалпына келеді."],"Квест пройден":["Quest completed","Квест аяқталды"],"Куда направить награду?":["Where should the reward go?","Сыйлықты қай бағытқа жібересің?"],"❗ ВАЖНО":["❗ IMPORTANT","❗ МАҢЫЗДЫ"],"Империя достигла полного расцвета! Теперь Анеллиону нужно развивать себя и поддерживать авторитет правителя, чтобы его не свергли. Вся награда достанется ему.":["The Empire has fully flourished! Anellion must now develop himself and maintain his authority to avoid being overthrown. The entire reward goes to him.","Империя толық гүлденді! Енді Анеллион өзін дамытып, тақтан құлатылмау үшін беделін сақтауы керек. Сыйлықтың бәрі оған беріледі."],"Империи нужны ${heroSplit.empire} XP из этой награды, чтобы не начать нести убытки.":["The Empire needs ${heroSplit.empire} XP from this reward to avoid losses.","Шығынға ұшырамау үшін Империяға осы сыйлықтан ${heroSplit.empire} XP қажет."],"Вся награда нужна Империи, чтобы она не начала нести убытки.":["The Empire needs the entire reward to avoid losses.","Шығынға ұшырамау үшін сыйлықтың бәрі Империяға қажет."],"✕ ${name} — недоступно":["✕ ${name} — unavailable","✕ ${name} — қолжетімсіз"],"Анеллион +${split.hero} XP · Империя +${split.empire} XP":["Anellion +${split.hero} XP · Empire +${split.empire} XP","Анеллион +${split.hero} XP · Империя +${split.empire} XP"],"Империя полностью прокачана — награда нужна Анеллиону":["The Empire is fully developed — Anellion needs the reward","Империя толық дамыды — сыйлық Анеллионға қажет"],"Вся награда нужна Империи":["The Empire needs the entire reward","Сыйлықтың бәрі Империяға қажет"],"Квест пройден!":["Quest completed!","Квест аяқталды!"],"Награда":["Reward","Сыйлық"],"Спальня пройдена!":["Bedroom completed!","Жатын бөлме аяқталды!"],"Открыт следующий предмет: ${items[selected+1].name}.":["Next object unlocked: ${items[selected+1].name}.","Келесі зат ашылды: ${items[selected+1].name}."],"Все предметы этой комнаты пройдены!":["All objects in this room are completed!","Бұл бөлмедегі барлық зат аяқталды!"],"Прогресс пока сохранён только до закрытия этой страницы.":["Progress is saved only until this page is closed.","Прогресс әзірге осы бет жабылғанға дейін ғана сақталады."],"Готово":["Done","Дайын"],"Следующий квест":["Next quest","Келесі квест"],"Квест ${trial.completed+1}/3 · Вопрос ${trial.index+1}/3":["Quest ${trial.completed+1}/3 · Question ${trial.index+1}/3","Квест ${trial.completed+1}/3 · Сұрақ ${trial.index+1}/3"],"Попытка завершена":["Attempt ended","Талпыныс аяқталды"],"Неверно. Открой предмет заново, чтобы повторить попытку.":["Incorrect. Open the object again to retry.","Қате жауап. Қайталау үшін затты қайта аш."],"КАБИНЕТ":["OFFICE","КАБИНЕТ"],"ГЛАВНАЯ ПЛОЩАДЬ":["MAIN SQUARE","БАСТЫ АЛАҢ"],"ОБЩАЯ СТОЛОВАЯ":["COMMUNAL DINING HALL","ОРТАҚ АСХАНА"],"КОНСИЛЬЕРГ":["CONSILYERG","КОНСИЛЬЕРГ"],"СЕЛЬСКОХОЗЯЙСТВЕННЫЕ ПОЛЯ":["FARMLAND","ЕГІСТІКТЕР"],"КАЗНА И СКЛАД":["TREASURY AND STOREHOUSE","ҚАЗЫНА МЕН ҚОЙМА"],"РАЗРУШЕННАЯ ЛЕСОПИЛКА":["RUINED SAWMILL","ҚИРАҒАН АҒАШ КЕСУ ОРНЫ"],"ВОЕННЫЙ ЛАГЕРЬ ИМПЕРИИ":["IMPERIAL MILITARY CAMP","ИМПЕРИЯНЫҢ ӘСКЕРИ ЛАГЕРІ"],"ЗАБРОШЕННАЯ ШАХТА":["ABANDONED MINE","ТАСТАЛҒАН ШАХТА"],"у":["у","у"],"У":["У","У"],"E · Пройти квест":["E · Start quest","E · Квестті бастау"],"НАГРАДА":["REWARD","СЫЙЛЫҚ"],"Развитие Анеллиона":["Anellion's development","Анеллионның дамуы"],"До следующего уровня Анеллиона":["Until Anellion's next level","Анеллионның келесі деңгейіне дейін"],"Развитие Империи":["Empire development","Империяның дамуы"],"До следующего уровня Империи":["Until the Empire's next level","Империяның келесі деңгейіне дейін"],"Три энергии из трёх":["Three energy charges out of three","Үш энергияның үшеуі де бар"],"Бесконечная энергия":["Unlimited energy","Шексіз энергия"],"Закрыть FAQ":["Close FAQ","FAQ бөлімін жабу"],"Об игре":["About the game","Ойын туралы"],"Какая цель игры?":["What is the goal of the game?","Ойынның мақсаты қандай?"],"Развить Анеллиона и восстановить Империю. У каждого — 10 уровней и своя шкала опыта.":["Develop Anellion and restore the Empire. Each has 10 levels and its own XP bar.","Анеллионды дамытып, Империяны қалпына келтіру. Әрқайсысында 10 деңгей және өз тәжірибе жолағы бар."],"Как начать квест?":["How do I start a quest?","Квестті қалай бастаймын?"],"Подойди к предмету и нажми E или кнопку «Пройти квест».":["Approach an object and press E or the Start quest button.","Затқа жақындап, E пернесін немесе «Квестті бастау» батырмасын бас."],"Как пройти предмет?":["How do I complete an object?","Затты қалай аяқтаймын?"],"У каждого предмета три квеста по три вопроса. Ответь верно на всю тройку, чтобы пройти квест.":["Each object has three quests of three questions. Answer all three correctly to complete a quest.","Әр затта үш сұрақтан тұратын үш квест бар. Квестті аяқтау үшін үш сұрақтың бәріне дұрыс жауап бер."],"Что будет после ошибки?":["What happens after a mistake?","Қателескеннен кейін не болады?"],"Текущая попытка завершится. При повторе будут те же вопросы с первого; уже пройденные квесты сохранятся. Правильный ответ после ошибки не показывается.":["The current attempt ends. A retry starts with the same first question; completed quests remain saved. The correct answer is not shown after a mistake.","Қазіргі талпыныс аяқталады. Қайталағанда сол сұрақтар біріншісінен басталады; аяқталған квесттер сақталады. Қатеден кейін дұрыс жауап көрсетілмейді."],"Почему у энергии знак ∞?":["Why does energy show ∞?","Неліктен энергияда ∞ белгісі бар?"],"В спальне все попытки бесплатные. После спальни запас — 3 энергии: одна на попытку, восстановление — по одной каждые 8 часов. Испытание открытия Консильерга тоже бесплатное.":["All bedroom attempts are free. After the bedroom, you have 3 energy charges: one per attempt, with one restored every 8 hours. The Consilyerg unlock trial is also free.","Жатын бөлмедегі талпыныстар тегін. Одан кейін қорда 3 энергия болады: әр талпынысқа біреуі кетеді, әр 8 сағатта біреуі қалпына келеді. Консильергті ашу сынағы да тегін."],"Кому достаётся опыт?":["Who receives XP?","Тәжірибе кімге беріледі?"],"В спальне опыт получают и Анеллион, и Империя. Дальше награду можно направлять герою или Империи — выбор за тобой.":["In the bedroom, both Anellion and the Empire receive XP. Afterward, you choose whether the reward goes to the hero or the Empire.","Жатын бөлмеде Анеллион да, Империя да тәжірибе алады. Одан кейін сыйлықты қаһарманға не Империяға бағыттауды өзің таңдайсың."],"Как открыть новые предметы?":["How do I unlock new objects?","Жаңа заттарды қалай ашамын?"],"Пройди все три квеста одного предмета — откроется следующий. Так предметы открываются по очереди.":["Complete all three quests for an object to unlock the next. Objects unlock one after another.","Бір заттың үш квестін де аяқтасаң, келесі зат ашылады. Заттар осылай кезекпен ашылады."],"Ур. ${info.level} / 10":["Lv. ${info.level} / 10","${info.level} / 10 деңгей"],"${info.xp} XP, уровень ${info.level} из 10":["${info.xp} XP, level ${info.level} of 10","${info.xp} XP, ${info.level}/10 деңгей"],"Энергия: ${state.energy} из 3":["Energy: ${state.energy} of 3","Энергия: ${state.energy}/3"],"Спальня":["Bedroom","Жатын бөлме"],"Кабинет":["Office","Кабинет"],"Главная площадь":["Main square","Басты алаң"],"Консильерг":["Consilyerg","Консильерг"],"Казна и склад":["Treasury and storehouse","Қазына мен қойма"],"Лесопилка":["Sawmill","Ағаш кесу орны"],"Военный лагерь":["Military camp","Әскери лагерь"],"Шахта":["Mine","Шахта"],"Анеллион: солнечный облик и янтарные глаза":["Anellion: solar form and amber eyes","Анеллион: күндей келбет пен янтарь түсті көздер"],"Анеллион: императорское облачение":["Anellion: imperial attire","Анеллион: императорлық киім"],"Анеллион: второе физическое преображение":["Anellion: second physical transformation","Анеллион: екінші дене өзгерісі"],"Анеллион: первое развитие мускулатуры":["Anellion: first muscle development","Анеллион: бұлшықеттердің алғашқы дамуы"],"Анеллион: новая белая туника":["Anellion: new white tunic","Анеллион: жаңа ақ туника"],"Анеллион: бритьё и новая причёска":["Anellion: shave and new haircut","Анеллион: қырыну және жаңа шаш үлгісі"],"Анеллион: чистый облик":["Anellion: clean appearance","Анеллион: таза келбет"],"Анеллион: начальный облик":["Anellion: initial appearance","Анеллион: бастапқы келбет"],"Не загрузилось изображение":["Image failed to load","Сурет жүктелмеді"],"Не удалось подготовить персонажа":["Could not prepare the character","Кейіпкерді дайындау мүмкін болмады"],"✦ Испытание Консильерга":["✦ Consilyerg trial","✦ Консильерг сынағы"],"Откроется на 9-м уровне Империи":["Unlocks at Empire level 9","Империяның 9-деңгейінде ашылады"],"Откроется на 8-м уровне Империи":["Unlocks at Empire level 8","Империяның 8-деңгейінде ашылады"],"Откроются на 7-м уровне Империи":["Unlocks at Empire level 7","Империяның 7-деңгейінде ашылады"],"Откроются на 6-м уровне Империи":["Unlocks at Empire level 6","Империяның 6-деңгейінде ашылады"],"Пройти 20 вопросов для открытия Консильерга":["Answer 20 questions to unlock Consilyerg","Консильергті ашу үшін 20 сұраққа жауап бер"],"Откроется после испытания на 5-м уровне Империи":["Unlocks after the trial at Empire level 5","Империяның 5-деңгейіндегі сынақтан кейін ашылады"],"Сначала пройди все предметы спальни":["First complete all bedroom objects","Алдымен жатын бөлмедегі барлық затты аяқта"],"Консильерг закрыт. Только просмотр.":["Consilyerg is locked. View only.","Консильерг жабық. Тек көруге болады."],"Анеллион:":["Anellion:","Анеллион:"],". Стрелки влево и вправо — движение.":[". Left and right arrow keys — move.",". Сол және оң жақ көрсеткілер — қозғалу."],"Не удалось открыть игру:":["Could not open the game:","Ойынды ашу мүмкін болмады:"],"ИСПЫТАНИЕ":["TRIAL","СЫНАҚ"],"Открытие Консильерга":["Unlocking Consilyerg","Консильергті ашу"],"20 из 20":["20 of 20","20/20"],"Испытание пройдено! Консильерг открыт.":["Trial completed! Consilyerg is unlocked.","Сынақ аяқталды! Консильерг ашылды."],"Консильерг — гора великих советчиков истории. Лишь раз в сто лет одному человеку удаётся покорить её вершину. Здесь возвышается монумент священной Совы: она помогает собраться с мыслями и найти совет в трудную минуту. Взамен гора сохраняет частицу твоих идей и мыслей, чтобы передать их следующим поколениям.":["Consilyerg is the mountain of history's great advisers. Only once in a hundred years can one person conquer its summit. Here stands the monument of the sacred Owl: she helps you gather your thoughts and find advice in difficult times. In return, the mountain keeps a part of your ideas and thoughts to pass on to future generations.","Консильерг — тарихтың ұлы кеңесшілерінің тауы. Жүз жылда бір рет қана бір адам оның шыңын бағындыра алады. Мұнда қасиетті Үкінің ескерткіші тұр: ол ойыңды жинақтап, қиын сәтте кеңес табуға көмектеседі. Оның орнына тау идеяларың мен ойларыңның бір бөлігін келесі ұрпақтарға жеткізу үшін сақтайды."],"Не удалось сохранить результат — он сохранится только до закрытия страницы.":["Could not save the result — it will last only until the page closes.","Нәтижені сақтау мүмкін болмады — ол бет жабылғанға дейін ғана сақталады."],"20 вопросов · Без энергии и XP":["20 questions · No energy or XP","20 сұрақ · Энергия мен XP жұмсалмайды және берілмейді"],"После ошибки нужно подождать один час.":["After a mistake, you must wait one hour.","Қатеден кейін бір сағат күту керек."],"Ответь верно на все 20 вопросов подряд. Ошибка завершает попытку; повтор — через час.":["Answer all 20 questions correctly in a row. A mistake ends the attempt; retry after one hour.","20 сұраққа қатарынан дұрыс жауап бер. Қате талпынысты аяқтайды; бір сағаттан кейін қайталай аласың."],"Начать испытание":["Start trial","Сынақты бастау"],"Вопрос ${index+1} из 20":["Question ${index+1} of 20","${index+1}/20 сұрақ"],"Не удалось сохранить время ожидания.":["Could not save the waiting time.","Күту уақытын сақтау мүмкін болмады."],"Повтор через ${Math.floor(seconds/60)} мин ${seconds%60} сек":["Retry in ${Math.floor(seconds/60)} min ${seconds%60} sec","${Math.floor(seconds/60)} мин ${seconds%60} сек кейін қайталау"],"Сова":["Owl","Үкі"],"Священная Сова":["Sacred Owl","Қасиетті Үкі"],"Не удалось сохранить прогресс Совы.":["Could not save Owl progress.","Үкі прогресін сақтау мүмкін болмады."],"Куда направить 500 XP?":["Where should 500 XP go?","500 XP қай бағытқа жіберілсін?"],"Анеллиону":["To Anellion","Анеллионға"],"Империи":["To the Empire","Империяға"],"Не удалось сохранить награду. Освободи место в браузере и выбери получателя ещё раз.":["Could not save the reward. Free up browser storage and choose the recipient again.","Сыйлықты сақтау мүмкін болмады. Браузерден орын босатып, алушыны қайта таңда."],"Анеллион +${amount.hero} XP · Империя +${amount.empire} XP":["Anellion +${amount.hero} XP · Empire +${amount.empire} XP","Анеллион +${amount.hero} XP · Империя +${amount.empire} XP"],"Награда сохранена. Прогресс Совы не удалось сохранить — после обновления забери награду снова, опыт повторно не начислится.":["Reward saved. Owl progress could not be saved — claim it again after refreshing; XP will not be awarded twice.","Сыйлық сақталды. Үкі прогресін сақтау мүмкін болмады — бетті жаңартқаннан кейін сыйлықты қайта ал, тәжірибе екінші рет берілмейді."],"Квест ${state.completed+1}/50 · Вопрос ${index+1}/7":["Quest ${state.completed+1}/50 · Question ${index+1}/7","Квест ${state.completed+1}/50 · Сұрақ ${index+1}/7"],"Попытка завершена. Можно попробовать снова.":["Attempt ended. You can try again.","Талпыныс аяқталды. Қайта байқап көруге болады."],"Повторить":["Retry","Қайталау"],"Квест ${state.completed+1} из 50":["Quest ${state.completed+1} of 50","${state.completed+1}/50 квест"],"Все 50 квестов Совы пройдены.":["All 50 Owl quests completed.","Үкінің барлық 50 квесті аяқталды."],"Семь верных ответов подряд. Награда — 500 XP. Попытка стоит одну энергию, следующий квест — через 16 часов.":["Seven correct answers in a row. Reward: 500 XP. Each attempt costs one energy; the next quest unlocks in 16 hours.","Қатарынан жеті дұрыс жауап. Сыйлық — 500 XP. Бір талпынысқа бір энергия кетеді, келесі квест 16 сағаттан кейін ашылады."],"E · Забрать награду":["E · Claim reward","E · Сыйлықты алу"],"Путь Анеллиона — вступление":["Anellion's Path — introduction","Анеллион жолы — кіріспе"],"Пропустить вступление":["Skip introduction","Кіріспені өткізу"],"Предыдущий кадр":["Previous frame","Алдыңғы кадр"],"Следующий кадр":["Next frame","Келесі кадр"],"Иллюстрация вступления":["Introduction illustration","Кіріспе суреті"],"На табличке: «":["The sign reads: “","Тақтайшада: «"],"Перейти к началу игры":["Go to the start of the game","Ойынның басына өту"],"Империя нуждается в тебе":["The Empire needs you","Империяға сен керексің"],"Анеллион, великие владения начинаются с малого. Осмотрись: даже обычная вещь может стать первым шагом к переменам.":["Anellion, great domains begin with small things. Look around: even an ordinary object can be the first step toward change.","Анеллион, ұлы иеліктер кішкентайдан басталады. Айналаңа қара: қарапайым заттың өзі өзгеріске бастайтын алғашқы қадам болуы мүмкін."],"После величия, увиденного во сне, ты просыпаешься среди запустения. Теперь Анеллиону предстоит пройти путь заново: восстановить свои владения и доказать, что он достоин короны.":["After the grandeur of your dream, you wake amid decay. Anellion must start again: restore his lands and prove himself worthy of the crown.","Түсіңдегі ұлылықтан кейін қаңыраған жерде ояндың. Енді Анеллион жолын қайта бастауы керек: иеліктерін қалпына келтіріп, тәжге лайық екенін дәлелдеуі тиіс."],"Начни с":["Start with","Мынадан баста:"],"грязного окна":["the dirty window","кір терезеден"],"в своей спальне. За маленькими переменами придут новые земли и испытания, а знания станут силой, которая возродит Империю.":["in your bedroom. Small changes will lead to new lands and trials, and knowledge will become the strength that revives the Empire.","жатын бөлмеңде. Кішкентай өзгерістерден кейін жаңа жерлер мен сынақтар келеді, ал білім Империяны қайта жандандыратын күшке айналады."],"Не всё откроется сразу. Каждый шаг приблизит тебя к Империи, которую ты видел во сне.":["Not everything will open at once. Every step brings you closer to the Empire you saw in your dream.","Бәрі бірден ашылмайды. Әр қадам сені түсіңде көрген Империяға жақындатады."],"Сделать первый шаг →":["Take the first step →","Алғашқы қадамды жаса →"],"Режим разработчика":["Developer mode","Әзірлеуші режимі"],"Во дворце Анеллион получает от гонцов доклад об уничтожении деревни войсками соседней империи.":["In the palace, messengers report to Anellion that a neighboring empire's troops have destroyed a village.","Сарайда хабаршылар Анеллионға көрші империяның әскері бір ауылды жойғанын жеткізді."],"Сон: известие во дворце":["Dream: news at the palace","Түс: сарайдағы хабар"],"На Консильерге — пике, куда он приходит за советом и новыми мыслями, — Анеллион решает потребовать возмещения, выбрав горный обход охраняемой границы.":["On Consilyerg, the peak where he seeks advice and fresh ideas, Anellion decides to demand compensation, taking a mountain route around the guarded border.","Кеңес пен жаңа ой іздеп келетін Консильерг шыңында Анеллион күзетілетін шекараны таумен айналып өтіп, өтемақы талап етуді шешті."],"Сон: решение на Консильерге":["Dream: a decision on Consilyerg","Түс: Консильергтегі шешім"],"У бескрайнего горного озера Анеллион организует лагерь и добычу припасов для отряда, в котором не все умеют плавать.":["By a vast mountain lake, Anellion sets up camp and gathers supplies for his group, some of whom cannot swim.","Шексіздей тау көлінің жағасында Анеллион жасаққа лагерь құрып, азық жинауды ұйымдастырды. Жасақтағы кейбіреулер жүзе алмайтын еді."],"Сон: препятствие у озера":["Dream: the lake obstacle","Түс: көлдегі кедергі"],"Анеллион раскрывает силу солнца и раздвигает воды озера, открывая всему отряду проход по дну.":["Anellion reveals the Sun's power and parts the lake's waters, opening a path along the bottom for his whole group.","Анеллион Күн күшін ашып, көл суын екіге бөлді де, бүкіл жасаққа түбімен өтетін жол ашты."],"Сон: сила Солнца":["Dream: the power of the Sun","Түс: Күннің күші"],"После спора об общей реке Анеллион берёт императора в плен со словами: «Коль не нравится что речка общая — будет только моя».":["After an argument over a shared river, Anellion captures the emperor, saying: “If you don't like sharing the river, it will be mine alone.”","Ортақ өзен туралы даудан кейін Анеллион императорды тұтқынға алып: «Өзеннің ортақ болғанын ұнатпасаң — енді тек менікі болады», — деді."],"Сон: пленение императора":["Dream: capturing the emperor","Түс: императорды тұтқындау"],"Вернувшись на Консильерг, Анеллион размышляет о жертвах и о том, что насилие было «практически» единственным выходом.":["Returning to Consilyerg, Anellion reflects on the victims and on violence having been “almost” the only way out.","Консильергке оралған Анеллион құрбандар туралы және зорлықтың «дерлік» жалғыз жол болғаны туралы ойланды."],"Сон: самоосознание":["Dream: self-reflection","Түс: өзін ұғыну"],"Анеллион проснулся. Ни дворца, ни войска, ни великой Империи. Только старая спальня и будильник от друга":["Anellion woke up. No palace, no army, no great Empire. Only an old bedroom and an alarm clock from a friend.","Анеллион оянды. Сарай да, әскер де, ұлы Империя да жоқ. Тек ескі жатын бөлме мен досы сыйлаған оятқыш қана бар."],"Пробуждение":["Awakening","Ояну"],"Это был… сон?":["Was that… a dream?","Бұл… түс пе еді?"],"Утро вернуло его в действительность. Но увиденное уже не отпускало.":["Morning brought him back to reality. But what he had seen would not let go.","Таң оны шындыққа қайтарды. Бірақ көргені ойынан кетпеді."],"Решимость":["Determination","Батыл шешім"],"Пока это только сон. Но я докажу себе, что могу этого достичь.":["For now, it is only a dream. But I'll prove to myself that I can achieve it.","Әзірге бұл тек түс. Бірақ мен оған жете алатынымды өзіме дәлелдеймін."],"Вот его спальня. Даже собственное жилище едва защищало от холода.":["This was his bedroom. Even his own home barely kept out the cold.","Міне, оның жатын бөлмесі. Өз үйінің өзі суықтан әрең қорғайтын."],"Первое владение: спальня":["First domain: bedroom","Алғашқы иелік: жатын бөлме"],"В общей столовой почти не осталось еды. Вот и всё, чем он сейчас правил.":["Almost no food remained in the communal dining hall. That was all he ruled for now.","Ортақ асханада тамақ таусылуға жақын еді. Оның әзірге билеп отырғаны — осы ғана."],"Первое владение: столовая":["First domain: dining hall","Алғашқы иелік: асхана"],"Этот клочок деревни он отбил у нескольких варваров. Громкое слово «Империя» пока было скорее обещанием.":["He had taken this small village plot from a few barbarians. The grand name “Empire” was still more of a promise.","Ауылдың осы шағын бөлігін ол бірнеше жабайыдан тартып алған еді. «Империя» деген ұлы атау әзірге уәдеге көбірек ұқсайтын."],"Первое владение: площадь":["First domain: square","Алғашқы иелік: алаң"],"Кабинет был немногим лучше. Решений требовалось много, а знаний и средств не хватало.":["The office was little better. There were many decisions to make, but knowledge and resources were scarce.","Кабинет те онша тәуір емес еді. Шешетін мәселе көп, ал білім мен қаражат тапшы болатын."],"Первое владение: кабинет":["First domain: office","Алғашқы иелік: кабинет"],"Среди старых бумаг нашёлся свиток о Консильерге — горе великих советчиков.":["Among old papers he found a scroll about Consilyerg, the mountain of great advisers.","Ескі қағаздардың арасынан ұлы кеңесшілер тауы — Консильерг туралы шиыршық табылды."],"Находка: свиток":["Discovery: the scroll","Табылған зат: шиыршық"],"Если там можно найти ответ, я должен попробовать.":["If answers can be found there, I have to try.","Егер онда жауап табылса, мен байқап көруге тиіспін."],"Он отправился к Консильергу, надеясь найти там начало своего пути.":["He set out for Consilyerg, hoping to find the beginning of his path there.","Ол жолының бастауын сол жерден табуға үміттеніп, Консильергке аттанды."],"Дорога к горе":["The road to the mountain","Тауға апарар жол"],"У подножия его ждали бочка воды, пустой стакан и неожиданное условие.":["At the foot of the mountain were a barrel of water, an empty glass, and an unexpected condition.","Тау етегінде оны бір бөшке су, бос стақан және күтпеген шарт күтіп тұрды."],"Странное условие":["A strange condition","Оғаш шарт"],"Выпить стакан воды… и не умереть?":["Drink a glass of water… and not die?","Бір стақан су ішіп… өлмей қалу ма?"],"Лишь тот, кто выпьет стакан этой воды и останется жив, сможет подняться на Консильерг.":["Only one who drinks a glass of this water and survives may climb Consilyerg.","Осы судан бір стақан ішіп, тірі қалған адам ғана Консильергке көтеріле алады."],"Анеллион рискнул и в холодном поту сделал глоток. Вода оказалась обычной водой, но страх не отступал: либо смерть, либо почёт.":["Anellion took the risk and drank, drenched in cold sweat. It was ordinary water, but fear remained: either death or honor.","Анеллион тәуекелге бел буып, суық терге малынып бір жұтым ішті. Су кәдімгі су еді, бірақ қорқыныш сейілмеді: не өлім, не құрмет."],"Стакан воды":["A glass of water","Бір стақан су"],"После глотка":["After the sip","Жұтымнан кейін"],"Бокал опустел. Анеллион всё ещё был в холодном поту, но оставался жив. Значит, он достоин подняться на Консильерг. И тут он почувствовал на руке обжигающее прикосновение солнца.":["The glass was empty. Anellion was still sweating, but alive. He was worthy of climbing Consilyerg. Then he felt the Sun's burning touch on his hand.","Стақан босады. Анеллион әлі суық терге малынып тұрса да, тірі еді. Демек, ол Консильергке көтерілуге лайық. Сол сәтте қолына Күннің күйдіргендей жанасуын сезді."],"Консильерг — гора великих советчиков. Здесь ищут новые мысли и оставляют знания, чтобы они помогли тем, кто придёт следом.":["Consilyerg is the mountain of great advisers. Here people seek new ideas and leave knowledge to help those who come after.","Консильерг — ұлы кеңесшілер тауы. Мұнда жаңа ой іздеп, кейін келетіндерге көмектессін деп білім қалдырады."],"Что такое Консильерг":["What is Consilyerg?","Консильерг деген не?"],"Он поднялся к вершине. На каменном уступе его ждала Сова — древняя и неподвижная.":["He climbed to the summit. On a stone ledge the Owl awaited him — ancient and motionless.","Ол шыңға көтерілді. Тас кертпеште оны көне әрі қозғалмайтын Үкі күтіп тұрды."],"Подъём":["The climb","Көтерілу"],"Сова не шевельнулась. Не прозвучало ни слова — но рядом с ней в голове Анеллиона возникла ясная мысль.":["The Owl did not move. Not a word was spoken, yet a clear thought formed in Anellion's mind beside her.","Үкі қимылдамады. Бірде-бір сөз айтылмаса да, оның жанында Анеллионның санасында анық ой пайда болды."],"Каменная Сова":["The stone Owl","Тас Үкі"],"Мысль не обещала лёгкого чуда. Она предлагала начать с того, что Анеллион мог изменить сам.":["The thought promised no easy miracle. It suggested starting with what Anellion could change himself.","Бұл ой оңай ғажайыпқа уәде бермеді. Ол Анеллион өзі өзгерте алатын нәрседен бастауды ұсынды."],"Первый совет: знания":["First advice: knowledge","Алғашқы кеңес: білім"],"Ты хочешь изменить свои владения? Начни со знаний в собственной голове. Учись понимать мир — и тебе станет легче принимать решения.":["Do you want to change your lands? Start with knowledge in your own mind. Learn to understand the world, and decisions will become easier.","Иеліктеріңді өзгерткің келе ме? Өз басыңдағы білімнен баста. Әлемді түсінуді үйренсең, шешім қабылдау оңайырақ болады."],"Чтобы не забывать изученное, Анеллион должен был связать повторение знаний с привычными местами и вещами.":["To л у нескольких варваров. Громкое слово «Империя» пока было скорее обещанием.", "title": "Первое владение: площадь", "thought": ""}, {"type": "scene", "text": "Кабинет был немногим лучше. Решений требовалось много, а знаний и средств не хватало.", "title": "Первое владение: кабинет", "thought": ""}, {"type": "scene", "text": "Среди старых бумаг нашёлся свиток о Консильерге — горе великих советчиков.", "title": "Находка: свиток", "thought": "Если там можно найти ответ, я должен попробовать."}, {"type": "scene", "text": "Он отправился к Консильергу, надеясь найти там начало своего пути.", "title": "Дорога к горе", "thought": ""}, {"type": "scene", "text": "У подножия его ждали бочка воды, пустой стакан и неожиданное условие.", "title": "Странное условие", "thought": "Выпить стакан воды… и не умереть?", "inscription": "Лишь тот, кто выпьет стакан этой воды и останется жив, сможет подняться на Консильерг."}, {"type": "scene", "text": "Анеллион рискнул и в холодном поту сделал глоток. Вода оказалась обычной водой, но страх не отступал: либо смерть, либо почёт.", "title": "Стакан воды", "thought": ""}, {"type": "scene", "title": "После глотка", "text": "Бокал опустел. Анеллион всё ещё был в холодном поту, но оставался жив. Значит, он достоин подняться на Консильерг. И тут он почувствовал на руке обжигающее прикосновение солнца.", "thought": ""}, {"type": "scene", "text": "Консильерг — гора великих советчиков. Здесь ищут новые мысли и оставляют знания, чтобы они помогли тем, кто придёт следом.", "title": "Что такое Консильерг", "thought": ""}, {"type": "scene", "text": "Он поднялся к вершине. На каменном уступе его ждала Сова — древняя и неподвижная.", "title": "Подъём", "thought": ""}, {"type": "scene", "text": "Сова не шевельнулась. Не прозвучало ни слова — но рядом с ней в голове Анеллиона возникла ясная мысль.", "title": "Каменная Сова", "thought": ""}, {"type": "scene", "text": "Мысль не обещала лёгкого чуда. Она предлагала начать с того, что Анеллион мог изменить сам. <script>
(() => {
  'use strict';
  const music = new Audio('assets/music-b03113cf5b7c1784.mp3');
  const tracks = {2: 'assets/music-b03113cf5b7c1784.mp3', 3: 'assets/music-b03113cf5b7c1784.mp3', 4: 'assets/music-044b80d7bd4eedb6.mp3', 6: 'assets/music-b50d7027ef2ab16a.mp3', 8: 'assets/music-7eb3896f6fbb7e60.mp3', 10: 'assets/music-13b0b6cd71552322.mp3'};
  let currentTrack = tracks[2];
  music.muted = window.GameSettings?.music === false;
  music.loop = true;
  music.preload = 'auto';
  music.volume = 0;
  music.load();
  let observedLevel = null, generation = 0, transitioning = false;
  function level() {
    if (window.GameSettings?.music === false) return 0;
    if (document.getElementById('royal-prologue')) return 0;
    const xp = window.WindowQuest?.progress.empireXp;
    return xp >= 10000 ? 10 : xp >= 6000 ? 8 : xp >= 2000 ? 6 : xp >= 700 ? 4 : xp >= 250 ? 3 : xp >= 100 ? 2 : 0;
  }
  function fade(target, duration, token) {
    const from = music.volume, start = performance.now();
    return new Promise(resolve => {
      function tick(now) {
        if (token !== generation) { resolve(false); return; }
        const progress = Math.min(1, (now - start) / duration);
        music.volume = from + (target - from) * progress;
        if (progress < 1) requestAnimationFrame(tick);
        else resolve(true);
      }
      requestAnimationFrame(tick);
    });
  }
  async function transition(next) {
    const token = ++generation;
    transitioning = true;
    try {
      // Keep the melody continuous, lowering it before the new level appears.
      if (!music.paused && !await fade(0, 1900, token)) return;
      if (token !== generation) return;
      if (!tracks[next]) {
        music.pause(); music.currentTime = 0; return;
      }
      if (currentTrack !== tracks[next]) {
        music.pause();
        music.src = tracks[next];
        currentTrack = tracks[next];
        music.currentTime = 0;
      }
      await music.play();
      if (token !== generation) return;
      await fade(0.18, 650, token);
    } catch { /* Retry after the next interaction if autoplay is restricted. */ }
    finally { if (token === generation) transitioning = false; }
  }

    const next = level();
    if (next !== observedLevel) {
      observedLevel = next;
      transition(next);
    } else if (tracks[next] && music.paused && !transitioning) {
      transition(next);
    }
  }

  // the browser still treats playback as part of the player's action.

    music.muted = window.GameSettings?.music === false;
    sync();
  });

  window.addEventListener('window-quest-close', sync);
  window.addEventListener('click', () => {
    const next = level();
    if (tracks[next] && music.paused) {
      observedLevel = next;
      transition(next);
    } else sync();
  });

  window.addEventListener('keydown', sync, true);
  setInterval(sync, 500);
  sync();

    <button type="button" class="settings-replay">Пройти комикс заново</button>
    <p class="settings-hint">Комикс откроется на выбранном языке. Прогресс игры сохранится.</p>
    <p class="settings-hint" data-save-error hidden></p>`;
  dialog.append(controls, section);
  const style = document.createElement('style');
  style.textContent = '.settings-dialog .settings-row{display:flex;align-items:center;gap:12px;margin:18px 0;color:#eed6ac;font:16px/1.4 Georgia,serif}.settings-row>span:first-child{flex:1}.settings-row input{width:23px;height:23px;accent-color:#c9a361;cursor:pointer}.settings-row select{max-width:55%;padding:8px;background:#292116;color:#f3dfb9;border:1px solid #a58a54;border-radius:4px;font:inherit}.settings-dialog .settings-hint{font-size:13px;line-height:1.5;color:#bda781}.settings-dialog .settings-replay{width:100%;padding:13px;border:1px solid #a58a54;background:#443721;color:#f3dfb9;font:16px Georgia,serif;cursor:pointer}.settings-dialog::backdrop{background:rgba(0,0,0,.75)}';
  document.head.append(style);
  const language = controls.querySelector('[data-language]');
  const music = controls.querySelector('[data-music]');
  const effects = controls.querySelector('[data-effects]');
  function refresh() {
    language.value = window.GameI18n.language;
    language.setAttribute('aria-label',t('Язык игры'));
    music.checked = window.GameSettings.music;
    effects.checked = window.GameSettings.effects;
    controls.querySelector('[data-music-status]').textContent = music.checked ? 'Включено' : 'Выключено';
    controls.querySelector('[data-effects-status]').textContent = effects.checked ? 'Включено' : 'Выключено';
    window.GameI18n.translate(dialog);
    button.textContent = '⚙ ' + t('Настройки');
    button.setAttribute('aria-label',t('Настройки'));
  }
  function saved(ok) { const error=controls.querySelector('[data-save-error]');error.hidden=ok;error.textContent=ok?'':t('Не удалось сохранить настройки.');refresh(); }
  language.addEventListener('change', () => saved(window.GameI18n.setLanguage(language.value)));
  music.addEventListener('change', () => saved(window.GameSettings.setMusic(music.checked)));
  effects.addEventListener('change', () => saved(window.GameSettings.setEffects(effects.checked)));
  controls.querySelector('.settings-replay').addEventListener('click', () => {
    close.click();
    window.playAnellionPrologue?.({replay:true});
  });
  window.addEventListener('game-language-change', refresh);
  window.addEventListener('keydown', event => { if (dialog.open) event.stopImmediatePropagation(); }, true);
  window.addEventListener('keyup', event => { if (dialog.open) event.stopImmediatePropagation(); }, true);
  window.GameSettingsUI = {open() {refresh();if(!dialog.open)button.click();}};
  refresh();
})();

</script>
</body>
</html>
